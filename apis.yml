aid: gardin
name: Gardin
description: >-
  Gardin is a UK-based agritech company (Abingdon, Oxfordshire) whose product,
  Gardin Pulse, is a real-time plant-level crop intelligence platform built on
  an optical sensor that measures chlorophyll fluorescence to assess
  photosynthetic efficiency. The sensors detect crop stress weeks before visible
  symptoms appear, letting growers optimise lighting, irrigation and climate
  control across glasshouses, polytunnels and indoor farms. Gardin exposes this
  plant-health data to growers and developers through the Gardin API — a set of
  OAuth2 client-credentials-secured HTTP services covering sensor/device
  management, an asynchronous bulk Query API for chlorophyll-fluorescence and
  Gardin-indices data, and a Notification API that delivers real-time plant
  alerts over webhooks and websockets. Gardin also integrates plant feedback into
  leading climate-control systems including Priva, Ridder and LetsGrow.
