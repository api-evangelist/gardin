apis:
- name: Gardin Query API
  description: >-
    Asynchronous bulk data API for downloading chlorophyll-fluorescence (ChF) and
    Gardin-indices data. Submit a query, poll its status, then download the result
    set as CSV. Supports control-area, device, index-name, daytime and time-range
    filters.
  humanURL: https://developers.gardin.ag/docs/gardin-api/submit-a-new-query
  baseURL: https://api.gardin.ag/v1
  properties:
  - type: APIReference
    url: https://developers.gardin.ag/docs/gardin-api/submit-a-new-query
- name: Gardin Sensor Management API
  description: >-
    Device registry and control API to list and find sensors, group devices, run
    and stop measurement / pick-poses jobs, enable or disable schedules, and check
    command job status.
  humanURL: https://developers.gardin.ag/docs/gardin-api/list-all-sensors
  baseURL: https://api.gardin.ag/v1
  properties:
  - type: APIReference
    url: https://developers.gardin.ag/docs/gardin-api/list-all-sensors
- name: Gardin Notification API
  description: >-
    Real-time plant-health alert delivery over webhooks and websockets. Emits
    PLANT_CRITICAL_ALERT, PLANT_STRESS_ALERT, PLANT_LIGHT_ALERT and
    PLANT_RECOVERY_ALERT events (RAISED / CLOSED) with an HMAC-SHA256
    Gardin-Signature header for verification.
  humanURL: https://developers.gardin.ag/docs/gardin-api/plant-alert
  baseURL: https://api.gardin.ag/v1
  properties:
  - type: Webhooks
    url: asyncapi/gardin-notification-webhooks.yml
