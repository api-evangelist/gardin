  sources: [docs]
- name: BearerAuth
  type: http
  scheme: bearer
  bearerFormat: JWT
  usage: 'Authorization: Bearer {access_token} on all Gardin API requests'
  sources: [docs]
notes:
- Client Id and Client Secret are provisioned by contacting Gardin Support (no self-service sign-up).
- The login/token host (login.gardin.ag) does not publish an OIDC/OAuth discovery document (probed 404).
- Enterprise SSO via Azure AD is documented for portal access at /docs/dev-guide/auth/azuread.
